services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Backend（gunicorn + Django） ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_ALLOWED_HOSTS: ${QUANLY_ALLOWED_HOSTS:-localhost,127.0.0.1}
      QUANLY_CORS_ALLOWED_ORIGINS: ${QUANLY_CORS_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QUANLY_ADMIN_USER: ${QUANLY_ADMIN_USER:-admin}
      QUANLY_ADMIN_PASSWORD: ${QUANLY_ADMIN_PASSWORD}
      QUANLY_ADMIN_EMAIL: ${QUANLY_ADMIN_EMAIL:-admin@quanly.local}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ---- P1 预留：Celery worker ----
    # celery:
    #   build:
    #     context: ./backend
    #   command: celery -A config worker -l info
    #   depends_on: [backend, redis]

  # ---- Frontend + nginx（反代） ----
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

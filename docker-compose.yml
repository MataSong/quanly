services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Backend（daphne ASGI + Django） ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # UC-T7: backend 双网络 —— default 连 postgres/redis;strategy_isolated(internal,不通外网)
    # 供策略容器回调 runner API。策略容器只接 strategy_isolated,故到不了 default 里的服务/外网。
    networks:
      - default
      - strategy_isolated
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      QUANLY_ALLOWED_HOSTS: ${QUANLY_ALLOWED_HOSTS:-*}
      QUANLY_CORS_ALLOWED_ORIGINS: ${QUANLY_CORS_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QUANLY_ADMIN_USER: ${QUANLY_ADMIN_USER:-admin}
      QUANLY_ADMIN_PASSWORD: ${QUANLY_ADMIN_PASSWORD}
      QUANLY_ADMIN_EMAIL: ${QUANLY_ADMIN_EMAIL:-admin@quanly.local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Market Collector — OKX WS 行情采集 ----
  market-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py run_market_collector
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OKX_FLAG: ${OKX_FLAG:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ---- Celery Worker (Docker-out-of-Docker) ----
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q strategy,celery,backtest -l info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # UC-T7: 策略容器要接入的隔离网络实际名(compose 给网络加项目前缀,项目名默认 quanly →
      # quanly_strategy_isolated)。若 COMPOSE_PROJECT_NAME 变了,须相应改此值或用 env 覆盖。
      STRATEGY_DOCKER_NETWORK: ${STRATEGY_DOCKER_NETWORK:-quanly_strategy_isolated}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---- Frontend + nginx（反代） ----
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  # 默认桥接网络（postgres/redis/backend/collector/worker/nginx 互通，可出外网）。
  default:
  # UC-T7 策略隔离网络：internal=true → 无外部路由（不通外网）。策略容器只接此网，
  # 网内只有 backend（双网络）可达，故用户代码到不了 postgres/redis/外网/其他容器。
  strategy_isolated:
    internal: true

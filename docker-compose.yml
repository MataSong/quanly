services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Backend（gunicorn + Django） ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      QUANLY_ALLOWED_HOSTS: ${QUANLY_ALLOWED_HOSTS:-localhost,127.0.0.1}
      QUANLY_CORS_ALLOWED_ORIGINS: ${QUANLY_CORS_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QUANLY_ADMIN_USER: ${QUANLY_ADMIN_USER:-admin}
      QUANLY_ADMIN_PASSWORD: ${QUANLY_ADMIN_PASSWORD}
      QUANLY_ADMIN_EMAIL: ${QUANLY_ADMIN_EMAIL:-admin@quanly.local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Market Collector — OKX WS 行情采集 ----
  market-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py run_market_collector
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OKX_FLAG: ${OKX_FLAG:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ---- Celery Worker (Docker-out-of-Docker) ----
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q strategy,celery -l info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      QUANLY_ENV: ${QUANLY_ENV:-prod}
      QUANLY_SECRET_KEY: ${QUANLY_SECRET_KEY}
      QUANLY_CREDENTIALS_ENC_KEY: ${QUANLY_CREDENTIALS_ENC_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---- Frontend + nginx（反代） ----
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

# 生产覆盖:docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 边缘用 Caddy 自动申请/续期 Let's Encrypt 证书;并补齐 celery-beat 定时校正与 OKX 私有 WS 采集。
x-backend-env: &prod-backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
  DB_ENGINE: ${DB_ENGINE}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  INFLUX_URL: ${INFLUX_URL}
  INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN}
  INFLUX_ORG: ${INFLUX_ORG}
  INFLUX_BUCKET: ${INFLUX_BUCKET}
  REDIS_URL: ${REDIS_URL}
  OKX_SYNC_INTERVAL: ${OKX_SYNC_INTERVAL}
  CELERY_BROKER_URL: ${REDIS_URL}

services:
  # 生产入口统一交给 Caddy(80/443,自动 HTTPS)。base 的 nginx 退到 8080,
  # 作为免证书的 HTTP 直连备用入口(本地自签场景下可绕过浏览器证书告警)。
  nginx:
    ports:
      - "8080:80"

  # Caddy:自动 HTTPS 边缘代理(证书持久化在 caddy_data 卷)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ws
      - frontend

  # Celery beat:按 OKX_SYNC_INTERVAL 定时全量校正余额/持仓(兜底 WS 遗漏)
  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: *prod-backend-env
    depends_on:
      - redis
      - backend

  # OKX 私有 WS 采集器:按用户凭证登录,实时回填余额/持仓/订单(模拟盘)
  private-ws:
    build: ./backend
    command: python manage.py run_private_ws --env sim
    environment: *prod-backend-env
    depends_on:
      - redis
      - backend

volumes:
  caddy_data: {}
  caddy_config: {}
